<body class="bg-surface text-on-surface antialiased min-h-screen flex flex-col items-center justify-center p-lg">
<!-- Main Container -->
<main class="w-full max-w-md mx-auto flex flex-col gap-lg">
<!-- Header Section -->
<header class="flex flex-col items-center text-center space-y-sm">
<!-- Mascot Image -->
<div class="w-48 h-48 rounded-full overflow-hidden mb-sm border-4 border-surface-container-high shadow-lg">
<img alt="Angry Ghostie mascot indicating a login error" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida/ADBb0ugXyXyASNYWwYNQlu7TM2aVyiPeEcHiKgVgJsinDIzt51H4WqArs2rNd_GP8VJ42fTwRcjAIJudzLdp2gjl2HtMUwa1lHWsvhREAdAY9k332IMOb2HxuOjprhiczHx6XbNAWjZyMLNmsvdVFGuYk1VHXf_2CEEapx3d5Qz4nRfDTBOpXQa__Q08G4TAo6Xpxpz12kNB1sly0ZVaJ0Aa5oHXb-UK7-dSC-Q9ZigueypdWI3Xg1UKtu2ADpo"/>
</div>
<h1 class="text-headline-lg-mobile font-headline-lg-mobile text-on-surface">Tekrar Hoş Geldin</h1>
<p class="text-body-md font-body-md text-on-surface-variant">Kaldığın yerden kodlamaya devam et.</p>
</header>
<!-- Error Alert Card -->
<div class="bg-error-container border border-error rounded-xl p-md flex items-start gap-sm shadow-sm">
<span class="material-symbols-outlined text-error mt-0.5" style="font-variation-settings: 'FILL' 1;">error</span>
<div class="flex flex-col">
<span class="text-label-md font-label-md text-on-error-container">Giriş başarısız! E-posta veya şifre hatalı.</span>
</div>
</div>
<!-- Login Form -->
<form action="#" class="flex flex-col gap-md" method="POST" novalidate="">
<!-- Email Input Group -->
<div class="flex flex-col gap-xs">
<label class="text-label-md font-label-md text-on-surface-variant" for="email">E-posta</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-md text-error z-10 pointer-events-none">mail</span>
<input class="w-full bg-surface-bright border-2 border-error text-body-md font-body-md text-on-surface rounded-lg py-sm pl-xl pr-md focus:outline-none focus:ring-4 focus:ring-error/20 transition-all shadow-[0_4px_20px_rgba(15,23,42,0.05)]" id="email" name="email" placeholder="ornek@eposta.com" required="" type="email" value="developer@example.com"/>
</div>
</div>
<!-- Password Input Group -->
<div class="flex flex-col gap-xs">
<div class="flex justify-between items-center">
<label class="text-label-md font-label-md text-on-surface-variant" for="password">Şifre</label>
<a class="text-label-md font-label-md text-primary hover:underline transition-colors" href="#">Şifremi Unuttum</a>
</div>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-md text-error z-10 pointer-events-none">lock</span>
<input class="w-full bg-surface-bright border-2 border-error text-body-md font-body-md text-on-surface rounded-lg py-sm pl-xl pr-md focus:outline-none focus:ring-4 focus:ring-error/20 transition-all shadow-[0_4px_20px_rgba(15,23,42,0.05)]" id="password" name="password" placeholder="••••••••" required="" type="password" value="wrongpassword123"/>
<button class="absolute right-md text-on-surface-variant hover:text-on-surface transition-colors focus:outline-none flex items-center justify-center p-1 rounded-md" type="button">
<span class="material-symbols-outlined">visibility_off</span>
</button>
</div>
</div>
<!-- Submit Button -->
<button class="btn-primary text-on-primary text-label-md font-label-md py-md px-lg rounded-xl flex items-center justify-center gap-sm mt-sm shadow-lg w-full transition-all duration-200" type="submit">
                Giriş Yap
                <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</form>
<!-- Footer Links -->
<div class="text-center mt-lg">
<p class="text-body-md font-body-md text-on-surface-variant">
                Hesabın yok mu? <a class="text-primary font-label-md font-semibold hover:underline" href="#">Hemen Kaydol</a>
</p>
