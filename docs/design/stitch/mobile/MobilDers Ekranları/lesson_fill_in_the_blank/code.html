<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Coderun - Lesson Screen</title>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600&amp;family=Plus+Jakarta+Sans:wght@700;800&amp;family=Space+Grotesk:wght@600&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Config from Guidelines -->
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "surface-tint": "#3f4cda",
                    "surface-container-low": "#f1f4f8",
                    "inverse-surface": "#2d3134",
                    "surface-container-lowest": "#ffffff",
                    "secondary-container": "#6bfe9c",
                    "secondary": "#006d37",
                    "on-secondary-container": "#00743a",
                    "primary": "#3d4ad8",
                    "on-tertiary": "#ffffff",
                    "on-primary-fixed-variant": "#222fc2",
                    "tertiary-fixed-dim": "#ebb2ff",
                    "on-surface": "#181c1f",
                    "tertiary-fixed": "#f8d8ff",
                    "surface-bright": "#f7fafd",
                    "on-surface-variant": "#454655",
                    "on-primary": "#ffffff",
                    "on-error": "#ffffff",
                    "on-secondary-fixed": "#00210c",
                    "on-tertiary-container": "#fffdff",
                    "tertiary-container": "#9c5ab7",
                    "on-secondary-fixed-variant": "#005228",
                    "primary-container": "#5865f2",
                    "error-container": "#ffdad6",
                    "secondary-fixed-dim": "#4ae183",
                    "background": "#f7fafd",
                    "tertiary": "#81419c",
                    "surface-container-highest": "#e0e3e7",
                    "on-primary-container": "#fffdff",
                    "surface-dim": "#d7dade",
                    "surface-container": "#ebeef2",
                    "secondary-fixed": "#6bfe9c",
                    "outline-variant": "#c6c5d7",
                    "on-secondary": "#ffffff",
                    "primary-fixed-dim": "#bec2ff",
                    "on-tertiary-fixed": "#320047",
                    "surface-container-high": "#e5e8ec",
                    "surface": "#f7fafd",
                    "on-primary-fixed": "#000569",
                    "primary-fixed": "#e0e0ff",
                    "inverse-on-surface": "#eef1f5",
                    "on-tertiary-fixed-variant": "#692984",
                    "on-error-container": "#93000a",
                    "outline": "#767686",
                    "error": "#ba1a1a",
                    "on-background": "#181c1f",
                    "surface-variant": "#e0e3e7",
                    "inverse-primary": "#bec2ff"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "stack-sm": "12px",
                    "stack-md": "24px",
                    "gutter": "24px",
                    "unit": "8px",
                    "stack-lg": "48px",
                    "margin-page": "32px"
            },
            "fontFamily": {
                    "body-lg": ["Lexend"],
                    "h2": ["Plus Jakarta Sans"],
                    "button-text": ["Lexend"],
                    "body-md": ["Lexend"],
                    "h1": ["Plus Jakarta Sans"],
                    "label-caps": ["Space Grotesk"]
            },
            "fontSize": {
                    "body-lg": ["18px", {"lineHeight": "1.6", "fontWeight": "400"}],
                    "h2": ["32px", {"lineHeight": "1.3", "fontWeight": "700"}],
                    "button-text": ["16px", {"lineHeight": "1.0", "fontWeight": "600"}],
                    "body-md": ["16px", {"lineHeight": "1.5", "fontWeight": "400"}],
                    "h1": ["40px", {"lineHeight": "1.2", "fontWeight": "800"}],
                    "label-caps": ["14px", {"lineHeight": "1.0", "letterSpacing": "0.05em", "fontWeight": "600"}]
            }
          }
        }
      }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface antialiased min-h-screen flex flex-col md:max-w-[400px] md:mx-auto md:border-x md:border-surface-variant md:shadow-2xl">
<!-- Header: Focused Task Header with Progress -->
<header class="flex items-center px-gutter py-stack-md gap-4 sticky top-0 bg-surface/90 backdrop-blur-md z-10">
<button class="w-10 h-10 flex items-center justify-center rounded-full bg-surface-container hover:bg-surface-container-high transition-colors text-on-surface-variant active:scale-90">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0, 'wght' 600;">close</span>
</button>
<div class="flex-1">
<div class="h-4 bg-surface-container-high rounded-full overflow-hidden border border-outline-variant/30 shadow-inner">
<!-- Progress Fill (30%) -->
<div class="h-full bg-secondary rounded-full relative overflow-hidden" style="width: 30%;">
<!-- Subtle Shimmer effect simulated with gradient -->
<div class="absolute inset-0 bg-gradient-to-r from-transparent via-white/20 to-transparent w-[200%] animate-[shimmer_2s_infinite]"></div>
</div>
</div>
</div>
<div class="flex items-center gap-1 text-tertiary-container font-button-text text-button-text">
<span class="material-symbols-outlined text-xl" style="font-variation-settings: 'FILL' 1;">favorite</span>
<span>3</span>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col px-gutter pb-32">
<!-- Prompt Header -->
<div class="mb-stack-md mt-4">
<h1 class="font-h2 text-h2 text-on-surface">Complete the list array</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-2">Fill in the missing string to add a third fruit.</p>
</div>
<!-- Code Snippet Container (Isometric dark card) -->
<div class="bg-inverse-surface rounded-xl p-6 border-b-[6px] border-[#181c1f] shadow-lg mb-stack-lg relative overflow-hidden">
<!-- Decorative dots for "window" feel -->
<div class="flex gap-1.5 mb-4 opacity-50">
<div class="w-3 h-3 rounded-full bg-error"></div>
<div class="w-3 h-3 rounded-full bg-[#fbbc05]"></div>
<div class="w-3 h-3 rounded-full bg-secondary"></div>
</div>
<div class="font-mono text-[17px] leading-relaxed text-on-tertiary flex flex-wrap items-center gap-x-2 gap-y-3">
<span class="text-tertiary-fixed-dim">fruits</span>
<span class="text-surface-variant">=</span>
<span class="text-surface-variant">[</span>
<span class="text-secondary-fixed">"apple"</span><span class="text-surface-variant">,</span>
<span class="text-secondary-fixed">"banana"</span><span class="text-surface-variant">,</span>
<!-- The Blank Dropzone -->
<div class="min-w-[100px] h-10 bg-surface-container/10 border-2 border-dashed border-outline-variant/50 rounded-lg flex items-center justify-center animate-pulse">
<span class="w-1/2 h-0.5 bg-outline-variant/50 rounded-full block"></span>
</div>
<span class="text-surface-variant">]</span>
</div>
</div>
<!-- Mascot & Tooltip Area -->
<div class="flex items-start gap-4 mb-stack-lg relative">
<div class="w-16 h-16 shrink-0 relative">
<img alt="Ghostie Mascot" class="w-full h-full object-contain drop-shadow-xl" data-alt="A 3D rendered illustration of a friendly, squishy ghost character with large expressive eyes, glowing slightly in a soft studio lighting setup. The background is completely transparent, emphasizing the tactile, toy-like premium texture of the mascot." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAZrP3EJJTRaYve0a3TxO5tyLBgk--bDYFPsEZXvjqpen-sskzqFWVN-eG3BXdbnmO_hIMBsCl0CURgoXv5Pzu7gKyBNJbGbKv3wY1M4taXLsoBB3hctgwfMAwG_J7rw4apYvBc2JLTYYFPDCeGlmE5l5CjSa7YTXjdjwbhEGopkmAa3QD3XhQ5O0vPYzdsrEg-EsLFvgViNyEIeVqKMQEyBuoeitOvEhoJjykSJeYjaHQJiipm399cbfaXe3iRWP0BxYtUR_gHQLs"/>
</div>
<!-- Tooltip Bubble -->
<div class="bg-inverse-surface text-on-tertiary rounded-2xl rounded-tl-sm px-4 py-3 font-body-md text-body-md shadow-xl relative top-2 border-b-[3px] border-[#181c1f]">
                Remember, text values need quotation marks!
                <!-- Small pointer triangle -->
<div class="absolute -left-2 top-0 w-0 h-0 border-t-[12px] border-t-inverse-surface border-l-[12px] border-l-transparent"></div>
</div>
</div>
<!-- Word Bank (Chips) -->
<div class="mt-auto">
<h3 class="font-label-caps text-label-caps text-outline mb-stack-sm uppercase tracking-wider">Word Bank</h3>
<div class="flex flex-wrap gap-stack-sm">
<!-- Chip 1 -->
<button class="bg-surface-container-lowest text-on-surface border-2 border-surface-variant rounded-xl px-5 py-3 font-button-text text-button-text border-b-[4px] active:border-b-2 active:translate-y-[2px] transition-all shadow-sm hover:border-primary-fixed-dim">
                    "cherry"
                </button>
<!-- Chip 2 -->
<button class="bg-surface-container-lowest text-on-surface border-2 border-surface-variant rounded-xl px-5 py-3 font-button-text text-button-text border-b-[4px] active:border-b-2 active:translate-y-[2px] transition-all shadow-sm hover:border-primary-fixed-dim">
                    append
                </button>
<!-- Chip 3 -->
<button class="bg-surface-container-lowest text-on-surface border-2 border-surface-variant rounded-xl px-5 py-3 font-button-text text-button-text border-b-[4px] active:border-b-2 active:translate-y-[2px] transition-all shadow-sm hover:border-primary-fixed-dim">
                    list
                </button>
</div>
</div>
</main>
<!-- Bottom Action Bar (Fixed) -->
<div class="fixed bottom-0 left-0 w-full bg-surface/90 backdrop-blur-md p-gutter border-t border-surface-variant/50 md:max-w-[400px] md:mx-auto md:left-1/2 md:-translate-x-1/2 z-20">
<!-- Disabled State Grand Slam Button -->
<button class="w-full bg-surface-container-high text-outline rounded-xl py-4 font-button-text text-button-text border-b-[4px] border-outline-variant/50 opacity-80 cursor-not-allowed text-center transition-all">
            Check Answer
        </button>
</div>
<!-- Optional Shimmer Animation Style -->
<style>
        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
    </style>
</body></html>
