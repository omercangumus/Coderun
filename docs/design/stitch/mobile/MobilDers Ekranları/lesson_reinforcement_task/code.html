                        "surface": "#f7fafd",

                        "primary-fixed": "#e0e0ff",

                        "on-tertiary-fixed-variant": "#692984",
                        "on-error-container": "#93000a",

                        "margin-page": "32px"
                    },
                    "fontFamily": {
                        "body-lg": ["Lexend"],
                        "h2": ["Plus Jakarta Sans"],
                        "button-text": ["Lexend"],
                        "body-md": ["Lexend"],
                        "h1": ["Plus Jakarta Sans"],
                        "label-caps": ["Space Grotesk"]

                    "fontSize": {
                        "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "h2": ["32px", { "lineHeight": "1.3", "fontWeight": "700" }],
                        "button-text": ["16px", { "lineHeight": "1.0", "fontWeight": "600" }],

    body {
      min-height: max(884px, 100dvh);
    }

<!-- Applying surface-container to loosely emulate a distinct state background while strictly adhering to theme colors -->
<body class="bg-surface-container min-h-screen flex flex-col font-body-md text-on-surface pb-safe antialiased">
<!-- TopAppBar (from JSON) -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-6 h-16 md:max-w-[1200px] md:mx-auto md:left-1/2 md:-translate-x-1/2 bg-white dark:bg-slate-900 border-b-4 border-slate-200 dark:border-slate-800 shadow-[0_30px_60px_-15px_rgba(88,101,242,0.05)]">
<div class="flex items-center gap-3">
<button class="hover:bg-slate-50 dark:hover:bg-slate-800 transition-all rounded-full p-2 -ml-2 text-[#5865F2] dark:text-[#5865F2]">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">close</span>
</button>
<img alt="Friendly Ghost Mascot" class="w-8 h-8 rounded-full object-cover border-2 border-[#5865F2]" data-alt="A stylized, modern 3D icon of a friendly, minimalist ghost character face glowing softly with a white and pale blue aura. The avatar design is cute and polished, set against a pristine, brightly lit studio background." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBHUENeyNaL9Ct7eac3SiE5sXLb4KxwqJX7f-iPvkS7YqmEvQ2oVGkG5VxWlfySYLeCjU8HgjpklEiRTjJ7PnlBpTSPgmi_Enla7BHo5shzvPyfvUviMEBrasXB_sngELNZiPRTDNLjaMptd1clvZ9HX-903rX0zSN3BZkuXkP8ZmwUeKmqfAXlsyvGbcEcnFyt4diACbtEz7Q481aBFaDk_mBgwWrrZJnPIqoyBqXCiR3ZnZLDB-LrvEj85r4bS9a3RAL0cLzFCwE"/>
</div>
<div class="text-2xl font-black text-[#5865F2] tracking-tight">Coderun</div>
<div class="font-plus-jakarta-sans font-bold text-lg flex items-center gap-1 text-[#5865F2] dark:text-[#5865F2]">
            52 <span class="text-xl">🔥</span>
</div>
</header>
<!-- Progress Bar -->
<div class="fixed top-16 left-0 w-full h-3 bg-surface-variant z-40">
<div class="h-full bg-secondary w-3/4 rounded-r-full shadow-[0_2px_10px_rgba(0,109,55,0.3)] transition-all duration-500"></div>
</div>
<!-- Main Canvas -->
<main class="flex-grow pt-[100px] px-gutter max-w-lg mx-auto w-full flex flex-col">
<!-- Reinforcement Badge -->
<div class="flex justify-center mb-stack-sm">
<div class="inline-flex items-center gap-2 bg-tertiary text-on-tertiary px-4 py-2 rounded-full border-b-[3px] border-on-tertiary-fixed-variant shadow-lg shadow-tertiary/20">
<span class="material-symbols-outlined text-[18px]">loop</span>
<span class="font-label-caps text-label-caps uppercase">Extra Practice</span>
</div>
</div>
<!-- Mascot Hint Area -->
<div class="flex items-end gap-4 mt-stack-sm mb-stack-lg relative">
<div class="w-20 h-20 shrink-0 relative z-10">
<img alt="Ghostie giving a hint" class="w-full h-full object-contain drop-shadow-xl" data-alt="A 3D render of a cute, friendly ghost mascot character with large expressive eyes, floating gently. The ghost is in a 'whispering' pose, leaning forward slightly as if sharing a secret. The lighting is soft and ambient, highlighting a smooth, squishy texture. The background is isolated." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBHpZ2GRLcQX8YuuRFO92T4NwXHAx9LO4GLVcVfJVn4hhpSkBksxH0_wWGF2Wj_tCJiWYN4Tl2Le5SlyKzWV5IE0BazDI-o-O-nKdvAmVOIhfC4OccfYzKNLVFhoYCIWkl0cgo6PKPGL6wXWUmj5PUmL_eO2MEEq825TwLPYQKLaMMFsQ1QpKfCly-yB1dNcVVtTpcAkK9G9MCNcQTstBMWHqgUf0KvK-QyZTCYFWZPOTk6vPlJCDmnTUmDs53L2yuF6EqkQN56fGo"/>
</div>
<!-- Speech Bubble -->
<div class="relative bg-inverse-surface text-inverse-on-surface p-stack-sm rounded-xl rounded-bl-none shadow-xl shadow-inverse-surface/10 mb-4 flex-grow">
<!-- Triangle Tail -->
<div class="absolute -bottom-3 left-0 w-0 h-0 border-t-[12px] border-t-inverse-surface border-r-[12px] border-r-transparent"></div>
<p class="font-body-md text-body-md">
<span class="font-bold text-tertiary-fixed-dim">Psst!</span> Don't forget, computers start counting from zero, not one!
                </p>
</div>
</div>
<!-- Question -->
<h1 class="font-h2 text-h2 text-on-surface text-center mb-stack-lg px-2">
            What is the index of the <span class="text-primary underline decoration-4 underline-offset-4">first</span> item?
        </h1>
<!-- Options Grid -->
<div class="grid grid-cols-1 gap-stack-md mt-auto mb-stack-lg">
<!-- Option A -->
<button class="group w-full bg-surface-container-lowest border-2 border-outline-variant border-b-[6px] rounded-xl p-6 flex flex-col items-center justify-center text-on-surface active:border-b-[2px] active:translate-y-[4px] hover:border-primary hover:text-primary transition-all duration-150">
<span class="font-h1 text-h1 text-center w-full">0</span>
</button>
<!-- Option B -->
<button class="group w-full bg-surface-container-lowest border-2 border-outline-variant border-b-[6px] rounded-xl p-6 flex flex-col items-center justify-center text-on-surface active:border-b-[2px] active:translate-y-[4px] hover:border-primary hover:text-primary transition-all duration-150">
<span class="font-h1 text-h1 text-center w-full">1</span>
</button>
</div>
<!-- Bottom Action -->
<div class="mt-auto pt-stack-sm pb-8">
<button class="w-full bg-surface-variant text-outline cursor-not-allowed border-b-[4px] border-outline-variant rounded-xl py-5 font-button-text text-button-text uppercase tracking-widest transition-all shadow-sm">
                Check Answer
            </button>
</div>
</main>
</body></html>
