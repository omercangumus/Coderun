<body class="bg-background text-on-background min-h-screen flex items-center justify-center relative overflow-hidden font-body-md">
<!-- Decorative Soft Background Blobs (Tactile/Playful vibe) -->
<div class="absolute top-[-10%] left-[-10%] w-[50vw] h-[50vw] bg-primary-fixed rounded-full mix-blend-multiply filter blur-[80px] opacity-70 pointer-events-none"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[60vw] h-[60vw] bg-tertiary-fixed rounded-full mix-blend-multiply filter blur-[100px] opacity-40 pointer-events-none"></div>
<!-- Main Content Container -->
<main class="relative z-10 w-full max-w-[1200px] mx-auto px-gutter py-12 flex flex-col lg:flex-row items-center justify-center gap-stack-lg lg:gap-[80px]">
<!-- Mascot Presentation (Left side on desktop, top on mobile) -->
<div class="relative w-full max-w-[320px] sm:max-w-[400px] lg:max-w-[480px] flex-shrink-0 flex justify-center items-center">
<!-- Soft ambient shadow specific to the mascot to make it 'pop' -->
<div class="absolute inset-0 bg-primary-container blur-[60px] opacity-20 rounded-full translate-y-8 scale-90"></div>
<img alt="Ghostie Mascot" class="relative z-10 w-full h-auto object-contain drop-shadow-xl" data-alt="A highly detailed, professional 3D render of a cute, soft, adorable ghost mascot floating cheerfully. The ghost is stylized as a premium designer toy, made of a squishy, matte-finish white material with large, expressive, friendly eyes. It is positioned in a dynamic, welcoming pose, seemingly eager to teach. The lighting is high-key, soft, and modern, casting subtle, diffused ambient shadows that emphasize the character's round, tactile, playful forms. The overall aesthetic perfectly matches a clean, modern SaaS light-mode UI, utilizing high-quality volumetric rendering to make the mascot feel physically present and approachable." src="https://lh3.googleusercontent.com/aida-public/AB6AXuByJ_Zadfdkz2rFYub-C6zrIHAQzGbdrAU4O27Dpca6nEcDdpJ5VdVSeO2P_khe-QWP2_sD4RvCkVT7eVk3cJ2RINzuqp177jMBm-z_BNfdKV-jZTjcgbDAR1Vevdjnc8-NP3PEMduLmA1gCBQ0om_PewDfXX9X8kMZHaQJYXLCV0rXPHA-7s_M7Pl4D1s6MNlHvTM5hENiNhfIratm-1MT7l__ojmMFWDor6Y4oAy1nI_4NDxHBXnGCQPleSoR778TV010a9yWDt0"/>
</div>
<!-- Typography & Actions (Right side on desktop, bottom on mobile) -->
<div class="flex flex-col text-center lg:text-left max-w-[600px] w-full">
<!-- Playful Welcome Badge -->
<div class="inline-flex items-center self-center lg:self-start bg-surface-container-highest rounded-full px-4 py-2 mb-stack-md border-2 border-surface-variant shadow-sm">
<span class="material-symbols-outlined text-primary mr-2 text-[20px]" style="font-variation-settings: 'FILL' 1;">waving_hand</span>
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-widest">Welcome to Coderun</span>
</div>
<!-- Headlines -->
<h1 class="font-h1 text-h1 text-on-surface mb-stack-md tracking-tight">
                Learn coding with a friendly guide
            </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant mb-stack-lg leading-relaxed max-w-[500px] mx-auto lg:mx-0">
                Master Python, DevOps, Cloud, and IaC through guided paths, XP, streaks, labs, and AI-powered hints.
            </p>
<!-- Tactile Call-to-Action Buttons -->
<div class="flex flex-col sm:flex-row items-center gap-stack-sm w-full">
<!-- Primary Button (Grand Slam Style) -->
<!-- The border-b-[6px] creates the physical 3D lip. Active states remove the lip and translate down to simulate a physical button press. -->
<button class="w-full sm:w-auto bg-primary text-on-primary font-button-text text-button-text px-8 py-5 rounded-xl border-b-[6px] border-on-primary-fixed-variant active:border-b-0 active:translate-y-[6px] active:mt-[6px] transition-all flex items-center justify-center gap-3 hover:bg-surface-tint focus:outline-none focus:ring-4 focus:ring-primary-fixed">
                    Start Learning
                    <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">rocket_launch</span>
</button>
<!-- Secondary Button (Outlined Tactile Style) -->
<button class="w-full sm:w-auto bg-surface text-primary font-button-text text-button-text px-8 py-5 rounded-xl border-2 border-primary border-b-[6px] active:border-b-2 active:translate-y-[4px] active:mt-[4px] transition-all flex items-center justify-center gap-3 hover:bg-primary-fixed focus:outline-none focus:ring-4 focus:ring-primary-fixed">
                    Take Placement Test
                    <span class="material-symbols-outlined">psychology</span>
</button>
</div>

<p class="font-body-md text-[13px] text-outline mt-stack-md flex items-center justify-center lg:justify-start gap-2">
<span class="material-symbols-outlined text-[16px]">bolt</span>
                Start for free. No credit card required.
            </p>
