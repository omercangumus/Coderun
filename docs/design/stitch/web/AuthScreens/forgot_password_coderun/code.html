<div class="absolute top-[60%] -right-[10%] w-[40%] h-[40%] rounded-full bg-surface-variant opacity-40 blur-[80px]"></div>

<main class="w-full max-w-md z-10">
<!-- Mascot -->
<div class="flex justify-center mb-lg">
<div class="w-32 h-32 rounded-full overflow-hidden shadow-[0_12px_40px_rgba(88,101,242,0.15)] bg-surface-container-lowest border border-surface-dim relative">
<img alt="Ghostie thinking mascot" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida/ADBb0ugLak4W1n5r35I8s1B8VZeS7lBXCcbCsWyWT_lCpQ8if73FtesFiCNTGYw4MenBE18VoM5NQ-DjuAt6fYOQAKvNu8vvjCr5hBZbs09vXQUNpfS-cu0c1oyIt966mca5OIfUR7t2KjyVPAs0OYuBUM_4OBATmZEUKkX8u08jAU9u8_GwEoPMZgFhflCCE5U5o65TrrS8cxQiUpWFzwszZ66YCjK6T0K-OOHapW7M6iylIBWW5o-J9zv9l2k"/>
</div>

<!-- Header -->
<div class="text-center mb-lg">
<h1 class="font-headline-md text-headline-md text-on-surface mb-sm">Şifreni mi unuttun?</h1>
<p class="font-body-md text-body-md text-on-surface-variant">E-posta adresini gir, sana bir sıfırlama bağlantısı gönderelim.</p>
</div>
<!-- Form -->
<form class="space-y-lg">
<!-- Input Group -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-xs" for="email">E-posta Adresi</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline-variant">mail</span>
</div>
<input class="block w-full pl-[40px] pr-sm py-sm font-body-md text-body-md text-on-surface bg-surface-bright border border-outline-variant rounded-lg focus:ring-0 focus:border-primary focus:shadow-[0_0_0_4px_rgba(88,101,242,0.2)] transition-all duration-200" id="email" name="email" placeholder="ornek@email.com" required="" type="email"/>
</div>
</div>
<!-- Action Button -->
<button class="w-full flex items-center justify-center gap-sm py-sm px-md bg-gradient-to-r from-primary to-primary-container text-on-primary font-label-md text-label-md rounded-lg shadow-md hover:scale-[1.02] hover:shadow-[0_0_20px_rgba(88,101,242,0.4)] active:scale-[0.98] active:translate-y-[2px] transition-all duration-200" type="button">
<span>Bağlantı Gönder</span>
<span class="material-symbols-outlined text-[18px]">send</span>
</button>

<div class="mt-lg text-center">

<span class="material-symbols-outlined text-[16px]">arrow_back</span>
